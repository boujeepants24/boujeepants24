<h2>Radiators</h2>
<p>If one radiator stays cold at the top, it has trapped air. Bleed it with a radiator key until water appears, then check boiler pressure.</p>
<h2>Thermostat</h2>
<p>The wireless thermostat pairs by holding the boiler's pairing button for 3 seconds.</p>
