[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-rag"
version = "0.1.0"
description = "Retrieval-augmented answers over one knowledge folder, exposed as an MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.4,<3",
  "mcp>=2.3,<3",
  "numpy>=2.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=5"]
voyage = ["voyageai>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pypdf>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
domainrag = "domainrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long lines are left to the formatter; prompt text and docstrings may run long

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
